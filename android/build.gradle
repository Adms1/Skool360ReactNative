buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.3")

    }
}

apply plugin: "com.facebook.react.rootproject"

// Force all third-party Android libraries (e.g. react-native-print) that
// hardcode an old compileSdkVersion to use the same SDK as the main app.
// This prevents the AAR metadata mismatch when dependencies require SDK 34+.
subprojects {
    plugins.withId("com.android.library") {
        android {
            compileSdkVersion 37
            buildToolsVersion "37.0.0"
        }
    }
    plugins.withId("com.android.application") {
        android {
            compileSdkVersion 37
            buildToolsVersion "37.0.0"
        }
    }
}
